<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Medicine - Pharmacy Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">💊 MediCare Pharmacy</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="medicines.html">Medicines</a></li>
                <li><a href="add-medicine.html" class="active">Add Medicine</a></li>
                <li><a href="billing.html">Billing</a></li>
                <li><a href="stock.html">Stock</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <div class="page-header">
            <div>
                <h1>Add New Medicine</h1>
                <p>Enter the medicine details to add it into the inventory</p>
            </div>
            <div>
                <a href="medicines.html" class="btn btn-secondary">&larr; Back to Medicines</a>
            </div>
        </div>

        <div class="section-box">
            <h2>Medicine Information</h2>
            
            <form action="#" method="post">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label for="med-name">Medicine Name *</label>
                        <input type="text" id="med-name" name="med_name" placeholder="e.g. Amoxicillin 500mg" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="tablet">Tablet</option>
                            <option value="capsule">Capsule</option>
                            <option value="syrup">Syrup</option>
                            <option value="injection">Injection</option>
                            <option value="ointment">Ointment</option>
                            <option value="drops">Drops</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="batch-no">Batch Number *</label>
                        <input type="text" id="batch-no" name="batch_no" placeholder="e.g. BAT-2024-09" required>
                    </div>

                    <div class="form-group">
                        <label for="manufacturer">Manufacturer / Supplier *</label>
                        <input type="text" id="manufacturer" name="manufacturer" placeholder="e.g. Pfizer, Sun Pharma" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price per Unit ($) *</label>
                        <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Initial Quantity *</label>
                        <input type="number" id="quantity" name="quantity" min="1" placeholder="e.g. 100" required>
                    </div>

                    <div class="form-group">
                        <label for="min-stock">Minimum Alert Threshold</label>
                        <input type="number" id="min-stock" name="min_stock" min="1" value="20">
                    </div>

                    <div class="form-group">
                        <label for="mfg-date">Manufacturing Date</label>
                        <input type="date" id="mfg-date" name="mfg_date">
                    </div>

                    <div class="form-group">
                        <label for="exp-date">Expiry Date *</label>
                        <input type="date" id="exp-date" name="exp_date" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Description & Storage Instructions</label>
                        <textarea id="notes" name="notes" rows="4" placeholder="Store in a cool and dry place away from sunlight..."></textarea>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Medicine</button>
                    <a href="medicines.html" class="btn btn-secondary">Cancel</a>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MediCare Pharmacy Management System. All rights reserved.</p>
    </footer>

</body>
</html>
